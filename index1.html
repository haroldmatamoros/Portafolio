<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    
    <link rel="stylesheet" href="style2.css">

</head>
<body>
      <section class="login-card" aria-label="Formulario de inicio de sesión">
    <header class="login-header">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña. (Interfaz únicamente)</p>
    </header>

    <form action="#" method="post">
      <div class="field">
        <label for="usuario">Ingrese su correo electrónico</label>
        <input id="usuario" name="usuario" type="email" autocomplete="username" placeholder="Tu correo electrónico" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingrese su contraseña" required />
      </div>

      <div class="actions">
        <label class="remember">
          <input type="checkbox" />
          Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn" type="submit">Iniciar seción </button>

      <div class="links">
        <a href="#">Crear cuenta</a>
      </div>
    </form>

    
  </section>
</body>
</html>

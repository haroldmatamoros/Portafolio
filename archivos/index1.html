<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    
<link rel="stylesheet" href="/static/style2.css">

<script src="/static/login.js" defer></script>

</head>
<body>
      <section class="login-card" aria-label="Formulario de inicio de sesión">
    <header class="login-header">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña. (Interfaz únicamente)</p>
    </header>



    <form id="loginForm" action="/login" method="POST">
      <div class="field">
        <label for="usuarioLogin">Correo electrónico</label>
        <input id="usuarioLogin" name="correo" type="email" autocomplete="username" placeholder="Ingrese su correo" required />
      </div>

      <div class="field">
        <label for="passwordLogin">Contraseña</label>
        <input id="passwordLogin" name="password" type="password" autocomplete="current-password" placeholder="Ingrese su contraseña" required />
      </div>

      <div class="actions">
        <label class="remember">
          <input type="checkbox" />
          Recordarme
        </label>
      </div>

      <button id="loginButton" class="btn" type="submit">Iniciar sesión</button>

      <div class="links">
        <a href="CREAR.html">Crear cuenta</a>
      </div>
    </form>

    
  </section>
</body>
</html>

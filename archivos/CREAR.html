<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
   
    <link rel="stylesheet" href="/static/crear.css">
    <script src="/static/crear.js" defer></script>

</head>
<body>
    <div class="container">
        <h2>Crear Cuenta</h2>
       
        <form id="registroForm" action="/registro" method="POST">
            <div class="form-group">
                <label for="registerName">Nombre Completo:</label>
                <input type="text" name="nombre" id="registerName" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Correo Electrónico:</label>
                <input type="email" name="correo" id="registerEmail" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Contraseña:</label>
                <input type="password" name="password" id="registerPassword" placeholder="Mínimo 4 caracteres" minlength="4" required>
            </div>
            <div class="form-group">
                <label for="registerPassword2">Confirmar Contraseña:</label>
                <input type="password" name="password2" id="registerPassword2" placeholder="Repite tu contraseña" minlength="4" required>
            </div>
            <button type="submit">Crear Cuenta</button>
        </form>
        <p class="login-link">¿Ya tienes cuenta? <a href="/">Iniciar sesión</a></p>
    </div>
</body>
</html>

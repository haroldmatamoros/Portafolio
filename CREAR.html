<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="crear.css">
</head>
<body>
    <div class="container">
        <h2>Crear Cuenta</h2>
        <div class="success-message" id="registroSuccess">¡Cuenta creada correctamente!</div>
        
        <form onsubmit="crearCuenta(event)">
            <div class="form-group">
                <label for="registerName">Nombre Completo:</label>
                <input type="text" id="registerName" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Correo Electrónico:</label>
                <input type="email" id="registerEmail" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Contraseña:</label>
                <input type="password" id="registerPassword" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="registerPassword2">Confirmar Contraseña:</label>
                <input type="password" id="registerPassword2" placeholder="Repite tu contraseña" minlength="8" required>
            </div>
            <button type="submit">Crear Cuenta</button>
        </form>
    </div>

     <script src="crear.js"></script>

</body>
</html>
